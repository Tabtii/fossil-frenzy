name: Validate Fossil Frenzy

on:
  pull_request:
  push:
    branches:
      - main
      - claude/epic-newton-osfjsd
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test game rules, saves and screens
        run: npm test -- --runInBand
      - name: Export Android, iOS and web bundles
        run: npx expo export --platform all --max-workers 2 --output-dir build/bundles
